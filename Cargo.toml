[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/pierce403/storm.dance"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
atomicwrites = "0.4.4"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
hex = "0.4"
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
walkdir = "2.5"
yrs = "0.27.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
