[package]
name = "storm-xmtp"
description = "XMTP transport boundary and sync engine for storm.dance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# libxmtp has no stable, published Rust SDK. This opt-in adapter is kept at a
# reviewed upstream revision while construction remains application-owned.
libxmtp = []

[dependencies]
async-trait.workspace = true
futures.workspace = true
storm-core = { path = "../storm-core" }
storm-protocol = { path = "../storm-protocol" }
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true

[package.metadata.stormdance]
libxmtp-repository = "https://github.com/xmtp/libxmtp"
libxmtp-rev = "66944e28f1d19269be7af0e11e165492f61a2b19"
libxmtp-rust-version = "1.94.0"

[lints]
workspace = true

