name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install dependencies
      run: npm ci

    - name: Build project (CI friendly mode)
      run: npm run build:ci

    - name: Run unit tests
      run: npm test -- --run

    - name: Install Playwright Chromium
      run: npm run test:e2e:install

    - name: Run browser E2E tests
      run: npm run test:e2e

    - name: Smoke-test the distributable XMTP CLI
      shell: bash
      run: |
        npm run package:cli
        install_root="$(mktemp -d)"
        npm install --prefix "$install_root" --ignore-scripts artifacts/storm-dance-*.tgz
        "$install_root/node_modules/.bin/stormdance" --help
        test ! -e "$install_root/node_modules/react"
        test ! -e "$install_root/node_modules/@tauri-apps/api"
        test ! -e "$install_root/node_modules/@xmtp/browser-sdk"

    - name: Check Rust formatting
      run: cargo fmt --all -- --check

    - name: Test native core and CLI
      run: cargo test --locked -p storm-core -p storm-protocol -p storm-storage -p storm-xmtp -p storm-cli

    - name: Lint native core and CLI
      run: cargo clippy --locked -p storm-core -p storm-protocol -p storm-storage -p storm-xmtp -p storm-cli --all-targets -- -D warnings

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
