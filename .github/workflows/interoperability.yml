name: Live XMTP Interoperability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/live-xmtp-matrix.mjs'
      - 'src/lib/collaboration/**'
      - 'src/hooks/useNotebookCollaboration.ts'
      - 'src/lib/nativeBridge*'
      - 'cli/**'
      - 'crates/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/interoperability.yml'

permissions:
  contents: read

concurrency:
  group: live-xmtp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-component-paths:
    name: Shared web/Tauri sessions ↔ directory CLI over XMTP dev
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run shipped component paths with four ephemeral XMTP installations
        run: npm run test:xmtp:live
